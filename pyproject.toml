[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "AI-powered data analysis agent with LangGraph, FastAPI, and Next.js"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.133.0",
    "uvicorn[standard]~=0.41.0",
    "pandas~=3.0.1",
    "langchain~=1.2.10",
    "langchain-google-genai~=4.2.1",
    "langgraph~=1.0.9",
    "pydantic~=2.12.5",
    "python-multipart~=0.0.22",
    "httpx~=0.28.1",
    "docker~=7.1",
    "pyarrow~=20.0.0",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.30",
    "alembic~=1.15",
    "langgraph-checkpoint-postgres~=2.0",
    "psycopg[binary]~=3.2",
]

[dependency-groups]
lint = ["ruff>=0.11", "pyright>=1.1"]
test = ["pytest>=8.0", "pytest-asyncio>=0.25", "pytest-cov>=6.0", "httpx>=0.28"]
dev = [{include-group = "lint"}, {include-group = "test"}]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "db"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=core --cov=api --cov=db --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["core", "api", "db"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
]
