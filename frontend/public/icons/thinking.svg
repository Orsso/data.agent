<svg width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
  <g style="transform-origin: 40px 30px;">
    <animateTransform attributeName="transform" type="scale" values="0.96;1.04;0.96" dur="1.8s" repeatCount="indefinite" />
    <!-- bulb -->
    <path d="M40 12 C31.5 12 24.5 19 24.5 27.5 C24.5 33 27.5 37.8 32 40.5 L48 40.5 C52.5 37.8 55.5 33 55.5 27.5 C55.5 19 48.5 12 40 12 Z" fill="#F0ECE3" stroke="#D8D3C8" stroke-width="1" />
    <!-- base -->
    <rect x="33" y="42" width="14" height="4" rx="1.5" fill="#D8D3C8" />
    <rect x="35" y="47" width="10" height="3" rx="1.5" fill="#D8D3C8" />
    <!-- glow -->
    <circle cx="40" cy="27" r="5" fill="#1F2AE9">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="27" r="9" fill="#6DA5FF" opacity="0">
      <animate attributeName="opacity" values="0;0.12;0" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
