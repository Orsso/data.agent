<svg width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="branch">
      <rect x="38" y="6" width="4" height="20" rx="2" fill="#D8D3C8" />
      <rect x="38" y="10" width="4" height="10" rx="2" fill="#D8D3C8" transform="rotate(45, 40, 14)" />
      <rect x="38" y="10" width="4" height="10" rx="2" fill="#D8D3C8" transform="rotate(-45, 40, 14)" />
    </g>
  </defs>
  <g style="transform-origin: 40px 30px;">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    <use href="#branch" />
    <use href="#branch" transform="rotate(60, 40, 30)" />
    <use href="#branch" transform="rotate(120, 40, 30)" />
    <use href="#branch" transform="rotate(180, 40, 30)" />
    <use href="#branch" transform="rotate(240, 40, 30)" />
    <use href="#branch" transform="rotate(300, 40, 30)" />
    <circle cx="40" cy="30" r="5" fill="#6DA5FF" />
  </g>
</svg>
